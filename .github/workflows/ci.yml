name: LevelUp Daily CI

on:
  push:
    branches: [agent/levelup-daily, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  persisted-mobile-e2e:
    if: ${{ secrets.E2E_DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate
      - run: npm run test:e2e
        env:
          E2E_RUN: '1'
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
